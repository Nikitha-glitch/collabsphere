<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Hub | CollabSphere</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .collab-layout {
            display: grid;
            grid-template-columns: 350px 1fr 400px;
            height: calc(100vh - 80px);
            overflow: hidden;
        }

        /* Sidebar: Team & Project Info */
        .collab-sidebar {
            background: rgba(15, 23, 42, 0.4);
            border-right: 1px solid var(--glass-border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .team-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.03);
        }

        .member-avatar {
            width: 35px;
            height: 35px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Center: Chat */
        .chat-area {
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
            min-height: 0;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            align-self: flex-start;
            background: rgba(255,255,255,0.08);
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
        }

        /* Right: Code Workspace */
        .code-workspace {
            background: rgba(15, 23, 42, 0.6);
            border-left: 1px solid var(--glass-border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        #codeArea {
            flex: 1;
            background: #0f172a;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            border: 1px solid #1e293b;
            resize: none;
            outline: none;
        }

        #codeArea:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">CollabSphere <span style="font-size: 0.7rem; opacity: 0.6; margin-left:10px;">| Collaboration Hub</span></a>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Back to Dashboard</a>
            <div id="projectTitleHeader" style="font-weight: 600; color: var(--primary);">Loading Project...</div>
        </div>
    </nav>

    <main class="collab-layout">
        <!-- Sidebar -->
        <aside class="collab-sidebar">
            <div>
                <h4 class="mb-4" style="color:var(--text-muted)">Project Team</h4>
                <div id="teamList" class="display: flex; flex-direction: column; gap:10px;">
                    <!-- Team members here -->
                </div>
            </div>
            
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                <h4 class="mb-2">Project Stats</h4>
                <p id="projStatus" style="font-size: 0.85rem; color: #10B981;">Active Development</p>
                <p id="projCategory" style="font-size: 0.85rem; color: var(--text-muted);">Category</p>
            </div>
        </aside>

        <!-- Chat Area -->
        <section class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <!-- Messages here -->
                <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 10px;">
                    This is the start of your collaboration for this project.
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="form-input" placeholder="Discuss ideas or share links..." style="flex:1;">
                <button id="sendMsgBtn" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </section>

        <!-- Code Workspace -->
        <section class="code-workspace">
            <div class="code-header">
                <h4 style="display:flex; align-items:center; gap:8px;">
                    <i class="fa-solid fa-code" style="color:var(--primary)"></i> Shared Workspace
                </h4>
                <button id="saveCodeBtn" class="btn btn-secondary" style="padding: 5px 12px; font-size: 0.8rem;">Save Changes</button>
            </div>
            <textarea id="codeArea" spellcheck="false" placeholder="// Paste code segments or technical notes here..."></textarea>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;">
                Changes here are persistent for your entire team.
            </p>
        </section>
    </main>

    <div id="toast-container"></div>

    <script type="module" src="../js/firebase-init.js"></script>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/collaboration.js"></script>
</body>
</html>
