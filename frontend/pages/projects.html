<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Projects | CollabSphere</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header {
            text-align: center;
            padding: 4rem 0;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--glass-border);
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto 3rem;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-wrapper input {
            padding-left: 40px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            padding-bottom: 4rem;
        }

        .project-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .category-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .project-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
        }

        .like-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .like-btn:hover {
            color: #F43F5E;
            transform: scale(1.1);
        }

        .like-btn.liked {
            color: #F43F5E;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">CollabSphere</a>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="events.html" class="nav-link">Events</a>
            <a href="createProject.html" class="btn btn-primary">Pitch Idea</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header animate-fade-in-up">
            <h1 class="mb-4 text-gradient">Explore Ideas</h1>
            <p style="color: var(--text-muted)">Find an amazing project and request to join the founding team.</p>
        </div>

        <div class="container mt-8 animate-fade-in-up delay-100">
            <div class="filter-bar">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="form-input" id="searchProjects" placeholder="Search by title, skills, or category...">
                </div>
                <select id="categoryFilter" class="form-input" style="width: auto;">
                    <option value="">All Categories</option>
                    <option value="Web Development">Web</option>
                    <option value="Mobile Development">Mobile</option>
                    <option value="AI">AI / ML</option>
                </select>
            </div>

            <div class="project-grid" id="projectsGrid">
                <!-- Data populated from API -->
                <div style="text-align: center; grid-column: 1 / -1; color: var(--text-muted);">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-2">Loading projects...</p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast-container"></div>

    <script type="module" src="../js/firebase-init.js"></script>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/projects.js"></script>

</body>
</html>
