<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabSphere</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 0;
        }

        .form-section {
            padding: 2rem;
            margin-bottom: 2rem;
        }

        textarea.form-input {
            min-height: 120px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">CollabSphere</a>
        <div class="nav-links">
            <a href="events.html" class="nav-link">Events</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
        </div>
    </nav>

    <div class="main-content container">
        <div class="form-container animate-fade-in-up">
            <h1 class="mb-2 text-gradient">Create a new Event</h1>
            <p class="mb-8" style="color: var(--text-muted)">Host a meetup, hackathon, or cultural fest to invite students.</p>

            <form id="createEventForm">
                <!-- Basic Info -->
                <div class="glass-panel form-section">
                    <h3 class="mb-4">Event Details</h3>
                    <div class="form-group">
                        <label class="form-label" for="title">Event Title</label>
                        <input type="text" id="title" class="form-input" required placeholder="e.g. AI Hackathon 2026">
                    </div>
                    
                    <div class="form-row" style="display:flex; gap:1.5rem;">
                        <div class="form-group" style="flex:1;">
                            <label class="form-label" for="eventType">Event Type</label>
                            <select id="eventType" class="form-input" required>
                                <option value="hackathon">Hackathon</option>
                                <option value="meetup">Meetup</option>
                                <option value="webinar">Webinar</option>
                                <option value="workshop">Workshop</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label class="form-label" for="category">Category</label>
                            <select id="category" class="form-input" required>
                                <option value="Web Development">Web Development</option>
                                <option value="AI">AI</option>
                                <option value="Career">Career Development</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">Detailed Description</label>
                        <textarea id="description" class="form-input" required placeholder="What is this event about?"></textarea>
                    </div>
                </div>

                <!-- Timing and Logistics -->
                <div class="glass-panel form-section">
                    <h3 class="mb-4">Timing & Logistics</h3>
                    <div class="form-row" style="display:flex; gap:1.5rem;">
                        <div class="form-group" style="flex:1;">
                            <label class="form-label" for="startDate">Start Date & Time</label>
                            <input type="datetime-local" id="startDate" class="form-input" required>
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label class="form-label" for="endDate">End Date & Time</label>
                            <input type="datetime-local" id="endDate" class="form-input" required>
                        </div>
                    </div>

                    <div class="form-row" style="display:flex; gap:1.5rem;">
                        <div class="form-group" style="flex:1;">
                            <label class="form-label" for="capacity">Participant Capacity</label>
                            <input type="number" id="capacity" class="form-input" required value="100" min="1">
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label class="form-label" for="registrationDeadline">Registration Deadline</label>
                            <input type="datetime-local" id="registrationDeadline" class="form-input" required>
                        </div>
                    </div>
                </div>

                <!-- Venue and Contact -->
                <div class="glass-panel form-section">
                    <h3 class="mb-4">Venue & Contact Information</h3>
                    <div class="form-group">
                        <label class="form-label" for="collegeVenue">College Name (Venue)</label>
                        <input type="text" id="collegeVenue" class="form-input" required placeholder="e.g. IIT Delhi, Main Auditorium">
                    </div>
                    
                    <div class="form-row" style="display:flex; gap:1.5rem;">
                        <div class="form-group" style="flex:1;">
                            <label class="form-label" for="contactPhone">Contact Mobile Number</label>
                            <input type="tel" id="contactPhone" class="form-input" required placeholder="e.g. +91 98765 43210">
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label class="form-label" for="contactEmail">Contact Email Address</label>
                            <input type="email" id="contactEmail" class="form-input" required placeholder="e.g. event@college.edu">
                        </div>
                    </div>
                </div>

                <div class="text-right">
                    <a href="events.html" class="btn btn-secondary" style="margin-right:1rem;">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="padding: 1rem 3rem;">Publish Event</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="toast-container"></div>

    <script type="module" src="../js/firebase-init.js"></script>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/events.js"></script>

</body>
</html>
