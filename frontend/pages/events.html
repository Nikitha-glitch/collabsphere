<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabSphere</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header {
            text-align: center;
            padding: 4rem 0;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--glass-border);
        }

        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            padding-bottom: 4rem;
        }

        .event-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .event-card:hover {
            transform: translateY(-5px);
            border-color: #34D399; /* Green hover for events */
        }

        .event-date {
            color: #34D399;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .event-type-badge {
            background: rgba(52, 211, 153, 0.15);
            color: #34D399;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">CollabSphere</a>
        <div class="nav-links">
            <a href="projects.html" class="nav-link">Explore Projects</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="createEvent.html" class="btn btn-primary">Create Event</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header animate-fade-in-up">
            <h1 class="mb-4 text-gradient">Tech & Cultural Events</h1>
            <p style="color: var(--text-muted)">Discover hackathons, webinars, and meetups from other colleges.</p>
        </div>

        <div class="container mt-8 animate-fade-in-up delay-100">
            <div class="event-grid" id="eventsGrid">
                <!-- Javascript will populate events here -->
                <div style="text-align: center; grid-column: 1 / -1; color: var(--text-muted);">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-2">Loading events...</p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast-container"></div>

    <script type="module" src="../js/firebase-init.js"></script>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/events.js"></script>

</body>
</html>
