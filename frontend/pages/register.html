<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CollabSphere</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--dark), #1e1b4b);
            padding: 2rem;
        }

        .auth-container {
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .helper-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .switch-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }
        
        .switch-link a {
            color: #818CF8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="glass-panel auth-container animate-fade-in-up">
        <div class="auth-header">
            <h1 class="text-gradient">Join CollabSphere</h1>
            <p style="color: var(--text-muted)">Create an account to build projects with strangers.</p>
        </div>

        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="firstName">First Name</label>
                    <input type="text" id="firstName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="lastName">Last Name</label>
                    <input type="text" id="lastName" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">College Email Address</label>
                <input type="email" id="email" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" required minlength="6">
            </div>

            <!-- College Specifics -->
            <div class="form-group">
                <label class="form-label" for="institution">College / University Name</label>
                <input type="text" id="institution" class="form-input" required placeholder="e.g. Stanford University">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="degree">Year of Study (B.Tech Year)</label>
                    <select id="degree" class="form-input" required>
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="Graduated">Graduated / Alumni</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="major">Branch / Major</label>
                    <input type="text" id="major" class="form-input" required placeholder="e.g. Computer Science">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1.1rem;">
                Create Account
            </button>
        </form>

        <div class="switch-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script type="module" src="../js/firebase-init.js"></script>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/auth.js"></script>

</body>
</html>
