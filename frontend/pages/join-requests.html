<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Requests | CollabSphere</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: calc(100vh - 80px);
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            background: rgba(15, 23, 42, 0.4);
            border-right: 1px solid var(--glass-border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-link {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all var(--transition-fast);
            text-decoration: none;
        }

        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(79, 70, 229, 0.1);
            color: white;
        }

        .content-area {
            padding: 2rem 3rem;
        }

        .tabs {
            display: flex;
            gap: 2rem;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 2rem;
        }

        .tab-btn {
            padding: 1rem 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: color 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .request-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--glass-border);
            transition: transform 0.2s ease;
            position: relative;
        }

        .request-card:hover {
            border-color: var(--primary);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
        }

        .status-pending { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
        .status-accepted { background: rgba(16, 185, 129, 0.15); color: #10B981; }
        .status-rejected { background: rgba(244, 63, 94, 0.15); color: #F43F5E; }

        .request-header {
            margin-bottom: 1rem;
            padding-right: 100px;
        }

        .request-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
        }

        .detail-item label {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">CollabSphere</a>
        <div class="nav-links">
            <a href="events.html" class="nav-link">Events</a>
            <a href="projects.html" class="nav-link">Explore</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
        </div>
    </nav>

    <div class="main-content dashboard-layout">
        <div class="sidebar">
            <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-house"></i> Overview</a>
            <a href="createProject.html" class="sidebar-link"><i class="fa-solid fa-plus"></i> Create Project</a>
            <a href="projects.html" class="sidebar-link"><i class="fa-solid fa-magnifying-glass"></i> Find Projects</a>
            <a href="messaging.html" class="sidebar-link"><i class="fa-solid fa-message"></i> Messages</a>
            <a href="join-requests.html" class="sidebar-link active"><i class="fa-solid fa-envelope"></i> Join Requests</a>
        </div>

        <div class="content-area animate-fade-in-up">
            <h2 class="mb-2">Collaboration Requests</h2>
            <p class="mb-8" style="color: var(--text-muted)">Manage incoming requests for your projects and track your outgoing applications.</p>

            <div class="tabs">
                <button class="tab-btn active" data-tab="received">Received Requests</button>
                <button class="tab-btn" data-tab="sent">Sent Applications</button>
            </div>

            <div id="requestsContainer">
                <div class="empty-state">
                    <i class="fa-solid fa-spinner fa-spin mb-4" style="font-size: 2rem;"></i>
                    <p>Loading requests...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="../js/firebase-init.js"></script>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/join-requests.js"></script>
</body>
</html>
