<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabSphere</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/animations.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .messages-container {
            display: flex;
            height: calc(100vh - 80px);
            margin-top: 80px;
            background: var(--bg-secondary);
            gap: 1px;
        }

        .conversations-sidebar {
            width: 320px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .conversations-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .conversations-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .search-box {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .search-box input {
            flex: 1;
            padding: 0.6rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            outline: none;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .conversation-item {
            padding: 1rem;
            background: var(--bg-primary);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: rgba(79, 70, 229, 0.1);
            border-color: var(--primary);
        }

        .conversation-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #818CF8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-name {
            color: var(--text-primary);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-preview {
            color: var(--text-muted);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 0.25rem;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .message-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .message-header-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .message-header-title h3 {
            margin: 0;
            color: var(--text-primary);
        }

        .message-header-title .status {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            animation: fadeIn 0.3s ease;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            word-wrap: break-word;
        }

        .message-bubble.received {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .message-bubble.sent {
            background: var(--primary);
            color: white;
        }

        .message-bubble.code {
            background: rgba(0, 0, 0, 0.3);
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.85rem;
            padding: 1rem;
            max-width: 70%;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 0.5rem;
        }

        .code-language {
            color: #34D399;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .copy-code-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: background var(--transition-fast);
        }

        .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .message-input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .input-actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .input-action-btn {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .input-action-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .input-action-btn.active {
            background: var(--primary);
            color: white;
        }

        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .textarea-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            min-height: 44px;
            max-height: 120px;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: inherit;
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .send-btn:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }

        .send-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .code-editor {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
            padding: 1rem;
            z-index: 10;
        }

        .code-editor.active {
            display: block;
        }

        .code-editor-header {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .code-language-select {
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            outline: none;
        }

        .code-textarea {
            width: 100%;
            height: 200px;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: monospace;
            outline: none;
            resize: vertical;
        }

        .typing-indicator {
            display: flex;
            gap: 0.25rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            .conversations-sidebar {
                width: 280px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .message-bubble.code {
                max-width: 95%;
            }
        }

        @media (max-width: 640px) {
            .messages-container {
                flex-direction: column;
            }

            .conversations-sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .message-view {
                height: auto;
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">CollabSphere</a>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="projects.html" class="nav-link">Projects</a>
            <a href="events.html" class="nav-link">Events</a>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="messages-container">
        <!-- Conversations Sidebar -->
        <div class="conversations-sidebar">
            <div class="conversations-header">
                <h2>Messages</h2>
                <div class="search-box">
                    <input type="text" id="searchConversations" placeholder="Search conversations...">
                </div>
            </div>
            <div class="conversations-list" id="conversationsList">
                <!-- Conversations will be loaded here -->
                <div style="padding: 1rem; text-align: center; color: var(--text-muted);">
                    <p>No conversations yet. Start messaging with someone!</p>
                </div>
            </div>
        </div>

        <!-- Message View -->
        <div class="message-view">
            <div class="message-header" id="messageHeader" style="display: none;">
                <div class="message-header-info">
                    <div class="conversation-avatar" id="selectedUserAvatar"></div>
                    <div class="message-header-title">
                        <h3 id="selectedUserName"></h3>
                        <div class="status" id="userStatus">Offline</div>
                    </div>
                </div>
            </div>

            <div class="message-list" id="messageList">
                <!-- Messages will be loaded here -->
                <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted);">
                    <p>Select a conversation to start messaging</p>
                </div>
            </div>

            <div class="message-input-area" id="messageInputArea" style="display: none;">
                <div class="input-actions">
                    <button class="input-action-btn" id="codeShareBtn" title="Share Code">
                        <i class="fa-solid fa-code"></i> Code
                    </button>
                </div>

                <div class="code-editor" id="codeEditor">
                    <div class="code-editor-header">
                        <select class="code-language-select" id="codeLanguage">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                            <option value="cpp">C++</option>
                            <option value="csharp">C#</option>
                            <option value="go">Go</option>
                            <option value="rust">Rust</option>
                            <option value="typescript">TypeScript</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="sql">SQL</option>
                        </select>
                        <button class="input-action-btn" id="closeCodeEditorBtn" style="flex-shrink: 0;">
                            <i class="fa-solid fa-xmark"></i> Close
                        </button>
                    </div>
                    <textarea class="code-textarea" id="codeInput" placeholder="Paste your code here..."></textarea>
                    <button class="send-btn" id="sendCodeBtn" style="margin-top: 0.5rem; width: 100%;">
                        <i class="fa-solid fa-paper-plane"></i> Send Code
                    </button>
                </div>

                <div class="input-wrapper">
                    <div class="textarea-wrapper">
                        <textarea class="message-input" id="messageInput" placeholder="Type a message... (Shift+Enter for new line)" rows="1"></textarea>
                    </div>
                    <button class="send-btn" id="sendMessageBtn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script type="module" src="../js/messaging.js"></script>
</body>
</html>
